/* Терминал в текстовом режиме: весь экран — одна сетка знакомест.
   Размер знакоместа подбирается под экран: Terminus 16, 20, 24, 28 или 32 (8×16 … 16×32).
   Рамки, меню, схема легионера, панель имплантов, консоль и строка клавиш рисуются символами.
   Два размера шрифта: 16 для всего, 32 для заголовка. Четыре яркости люминофора. */
:root {
  color-scheme: dark;
  --bg: #020a04;
  --glass: #0e2a17;
  --dim: #0f4a1e;
  --mid: #2a9a44;
  --fg: #48f06a;
  --hi: #c4ffd0;
  --glow: rgba(72, 240, 106, .45);
  --ch: 16px;
  --cw: 8px;
  --fam: "T16", monospace;
  --famb: "T16B", monospace;
  --scan: .3;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; background: var(--bg); }
body {
  margin: 0;
  color: var(--fg);
  font: 400 var(--ch)/var(--ch) var(--fam);
  -webkit-font-smoothing: none;
  font-smooth: never;
  font-synthesis: none;
  text-rendering: optimizeSpeed;
  background: radial-gradient(120% 90% at 50% 40%, var(--glass), var(--bg) 75%) fixed, var(--bg);
}
body::after { /* сканлайны, цветная маска и виньетка поверх всего окна */
  content: "";
  position: fixed; inset: 0;
  background:
    repeating-linear-gradient(180deg, rgba(0,0,0,var(--scan)) 0 1px, transparent 1px 3px),
    repeating-linear-gradient(90deg, rgba(255,40,40,.045) 0 1px, rgba(40,255,90,.02) 1px 2px, rgba(60,90,255,.05) 2px 3px),
    radial-gradient(140% 120% at 50% 50%, transparent 60%, rgba(0,0,0,.55) 100%);
  pointer-events: none;
  z-index: 50;
}

/* ---------- экран ---------- */
/* терминал не выделяется мышью: выделение перебивало клики и рисовало синие полосы поверх экрана */
.term, #boot { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
::selection { background: var(--fg); color: var(--bg); }
.term { margin: 0 auto; padding: 24px var(--pad, 32px) 16px; transform-origin: 50% 40vh; }
.head { height: calc(var(--ch) * 5); display: flex; justify-content: space-between; align-items: flex-start; gap: var(--ch); }
.head > div:first-child { min-width: 0; }
.head .sv { height: var(--ch); white-space: pre; overflow: hidden; }
.head .m, .m { color: var(--mid); }
/* заголовок — тот же Terminus, увеличенный ровно в 2 раза */
.title { font: calc(var(--ch) * 2)/calc(var(--ch) * 2) var(--famb); height: calc(var(--ch) * 2); margin: calc(var(--ch) / 2) 0; white-space: nowrap; overflow: hidden; text-shadow: 0 0 10px var(--glow), 0 0 2px var(--glow); }
.legion { display: flex; gap: var(--ch); align-items: flex-start; flex: none; }
.legion .cap { text-align: right; white-space: pre; }
#emblem { display: block; filter: drop-shadow(0 0 4px var(--glow)); }
.scrw { position: relative; margin-top: var(--ch); }
#scr { font-variant-emoji: text; margin: 0; font: var(--ch)/var(--ch) var(--fam); white-space: pre; color: var(--fg); }
#cmd { position: absolute; height: var(--ch); padding: 0; border: 0; outline: 0; background: transparent; color: transparent; caret-color: transparent; font: var(--ch)/var(--ch) var(--fam); opacity: 0; }

/* роли яркости */
#scr .d { color: var(--dim); }
#scr .m { color: var(--mid); }
#scr .h { color: var(--hi); text-shadow: 0 0 6px var(--glow); }
#scr .i { background: var(--fg); color: var(--bg); box-shadow: 0 0 10px var(--glow); }
#scr .cur { color: var(--hi); animation: blink 1s steps(1) infinite; }
/* пиксели фигуры: верхняя и нижняя половины знакоместа */
#scr .c1 { color: var(--dim); } #scr .c2 { color: var(--mid); } #scr .c3 { color: var(--fg); } #scr .c4 { color: var(--hi); text-shadow: 0 0 6px var(--glow); }
#scr .c1b2 { color: var(--dim); background: var(--mid); }
#scr .c1b3 { color: var(--dim); background: var(--fg); }
#scr .c1b4 { color: var(--dim); background: var(--hi); }
#scr .c2b1 { color: var(--mid); background: var(--dim); }
#scr .c2b3 { color: var(--mid); background: var(--fg); }
#scr .c2b4 { color: var(--mid); background: var(--hi); }
#scr .c3b1 { color: var(--fg); background: var(--dim); }
#scr .c3b2 { color: var(--fg); background: var(--mid); }
#scr .c3b4 { color: var(--fg); background: var(--hi); }
#scr .c4b1 { color: var(--hi); background: var(--dim); }
#scr .c4b2 { color: var(--hi); background: var(--mid); }
#scr .c4b3 { color: var(--hi); background: var(--fg); }
@keyframes blink { 0%, 49% { opacity: 1; } 58% { opacity: .35; } 70%, 100% { opacity: 0; } }

/* ---------- кинескоп ---------- */
#glass { position: fixed; inset: 0; pointer-events: none; z-index: 52; border-radius: 34px / 28px;
  box-shadow: 0 0 0 100vmax #000, inset 0 0 90px 24px rgba(0,0,0,.55), inset 0 0 14px 4px rgba(0,0,0,.7); }
#glare { position: fixed; inset: 0; pointer-events: none; z-index: 52;
  background: radial-gradient(38% 30% at 18% 12%, rgba(220,255,230,.045), transparent 70%),
              linear-gradient(115deg, transparent 0 30%, rgba(220,255,230,.018) 34%, transparent 42%); }
#flick { position: fixed; inset: 0; pointer-events: none; z-index: 53; background: #000; opacity: 0; }
#roll { position: fixed; left: 0; right: 0; top: 0; height: 22vh; pointer-events: none; z-index: 51;
  background: linear-gradient(180deg, transparent, rgba(200,255,210,.035) 45%, rgba(200,255,210,.05) 55%, transparent);
  animation: roll 16s linear infinite; will-change: transform; }
@keyframes roll { 0% { transform: translateY(110vh); } 45% { transform: translateY(-30vh); } 100% { transform: translateY(-30vh); } }
#gband { position: fixed; left: 0; right: 0; height: 4px; pointer-events: none; z-index: 54; background: var(--hi); opacity: .3; mix-blend-mode: screen; }
#power { position: fixed; inset: 0; z-index: 70; background: #000; display: grid; place-items: center; }
#power i { display: block; width: 2px; height: 2px; background: #cfeed7; box-shadow: 0 0 8px 2px var(--glow); }
#boot { position: fixed; inset: 0; z-index: 60; background: radial-gradient(120% 90% at 50% 40%, var(--glass), var(--bg) 75%), var(--bg);
  padding: calc(var(--ch) * 3) var(--pad, 32px); white-space: pre; font: var(--ch)/var(--ch) var(--fam); color: var(--fg); transition: opacity .35s; }
#boot .m { color: var(--mid); } #boot .h { color: var(--hi); }
#boot .cur { color: var(--hi); animation: blink 1s steps(1) infinite; }
#boot.out { opacity: 0; pointer-events: none; }
/* курсор-прицел */
@media (pointer: fine) { html.cc, html.cc * { cursor: none !important; } }
#cur, .trl { position: fixed; left: 0; top: 0; pointer-events: none; z-index: 80; }
#cur { width: 17px; height: 17px; margin: -8px 0 0 -8px;
  background: linear-gradient(var(--hi), var(--hi)) 8px 0 / 1px 6px no-repeat, linear-gradient(var(--hi), var(--hi)) 8px 11px / 1px 6px no-repeat,
              linear-gradient(var(--hi), var(--hi)) 0 8px / 6px 1px no-repeat, linear-gradient(var(--hi), var(--hi)) 11px 8px / 6px 1px no-repeat,
              linear-gradient(var(--hi), var(--hi)) 7px 7px / 3px 3px no-repeat;
  filter: drop-shadow(0 0 3px var(--fg)); }
/* над кнопками и ячейками — захват цели: квадратные скобки по углам и точка в центре */
#cur.on { width: 19px; height: 19px; margin: -9px 0 0 -9px;
  background:
    linear-gradient(var(--hi), var(--hi)) 0 0 / 6px 2px no-repeat, linear-gradient(var(--hi), var(--hi)) 0 0 / 2px 6px no-repeat,
    linear-gradient(var(--hi), var(--hi)) 100% 0 / 6px 2px no-repeat, linear-gradient(var(--hi), var(--hi)) 100% 0 / 2px 6px no-repeat,
    linear-gradient(var(--hi), var(--hi)) 0 100% / 6px 2px no-repeat, linear-gradient(var(--hi), var(--hi)) 0 100% / 2px 6px no-repeat,
    linear-gradient(var(--hi), var(--hi)) 100% 100% / 6px 2px no-repeat, linear-gradient(var(--hi), var(--hi)) 100% 100% / 2px 6px no-repeat,
    linear-gradient(var(--hi), var(--hi)) 8px 8px / 3px 3px no-repeat; }
#cur.txt { width: 2px; height: var(--ch); margin: calc(var(--ch) / -2) 0 0 -1px; background: var(--hi); }
.trl { width: 3px; height: 3px; margin: -1px 0 0 -1px; background: var(--fg); }

@media (max-width: 700px) {
  .legion .cap { display: none; }
  .term { padding-top: 16px; }
}
@media (prefers-reduced-motion: reduce) { #scr .cur, #boot .cur, #roll { animation: none; } #roll { display: none; } }
</style>
</head>

<script>

// спрайт легионера 24×40 (Мк IV). lv: яркость 0–4, part: h голова · t торс · a руки · l ноги, bone: b кость · k провал · g сердце, bpart: часть тела кости
const SPRITE = {"lv": ["........................", "........................", ".........333333.........", ".....33.31111113.33.....", ".....33.30011003.33.....", ".....33.34400443.33.....", ".....33.30011003.33.....", "....3013211111113103....", ".3332200021111100022333.", "311111220002100022111113", "314111110000000021111413", "311111110111111021111113", "311111112011110211111113", "311111110111111021111113", "311111110111111021111113", "300330030111111030033003", ".3330300111111110033003.", ".3003.311111111113.3003.", ".3113.311111111113.3113.", ".3113..3000000003..3113.", ".3003..3104444013..3003.", "32223.321100001113.32223", "31113.300000000003.31113", "31113.311021110113.31113", "31113.311021110113.31113", "31013.311103302113.31013", "30203.32103..30213.30203", "32123.30013..31003.32123", "31113.30003..30003.31113", "33333.32223..32223.33333", "......31113..31113......", ".....31111133111113.....", "......31113..31113......", "......30003..30003......", "......31113..31113......", "......30003..30003......", ".....322223..322223.....", ".....311113..311113.....", ".....311113..311113.....", ".....333333..333333....."], "part": ["........................", "........................", ".........hhhhhh.........", ".....tt.hhhhhhhh.tt.....", ".....tt.hhhhhhhh.tt.....", ".....tt.hhhhhhhh.tt.....", ".....tt.hhhhhhhh.tt.....", "....tttthhhhhhhhtttt....", ".aaaaatthhhhhhhhttaaaaa.", "aaaaaaaahhhhhhhhaaaaaaaa", "aaaaaaaattttttttaaaaaaaa", "aaaaaaaattttttttaaaaaaaa", "aaaaaaaaattttttaaaaaaaaa", "aaaaaaaattttttttaaaaaaaa", "aaaaaaaattttttttaaaaaaaa", "aaaaaaaattttttttaaaaaaaa", ".aaaaattttttttttttaaaaa.", ".aaaa.tttttttttttt.aaaa.", ".aaaa.tttttttttttt.aaaa.", ".aaaa..tttttttttt..aaaa.", ".aaaa..tttttttttt..aaaa.", "aaaaa.tttttttttttt.aaaaa", "aaaaa.tttttttttttt.aaaaa", "aaaaa.tttttttttttt.aaaaa", "aaaaa.tttttttttttt.aaaaa", "aaaaa.ttttlttltttt.aaaaa", "aaaaa.lttll..llttl.aaaaa", "aaaaa.lllll..lllll.aaaaa", "aaaaa.lllll..lllll.aaaaa", "aaaaa.lllll..lllll.aaaaa", "......lllll..lllll......", ".....llllllllllllll.....", "......lllll..lllll......", "......lllll..lllll......", "......lllll..lllll......", "......lllll..lllll......", ".....llllll..llllll.....", ".....llllll..llllll.....", ".....llllll..llllll.....", ".....llllll..llllll....."], "bone": ["........................", "........................", "...........bb...........", ".........bbbbbb.........", ".........bbbbbb.........", ".........kkbbkk.........", ".........bbbbbb.........", "..........bbbb..........", "........................", "......bbbbbbbbbbbb......", "...........bb...........", "..bb....bbbbbbbb....bb..", "..bb.......bb.......bb..", "..bb...bbbbbbbbbb...bb..", "..bb.....g.bb.g.....bb..", "..bb....bbbbbbbb....bb..", "..bb.......bb.......bb..", "..bb....bbbbbbbb....bb..", "..bb.......bb.......bb..", "..bb.......bb.......bb..", "..bb....b..bb..b....bb..", "........bbbbbbbb........", "...b................b...", "...b....b......b....b...", "...b....b......b....b...", "...b....b......b....b...", "...b....b......b....b...", "........b......b........", ".bbb....b......b....bbb.", "........b......b........", "........b......b........", ".......bbb....bbb.......", ".......b.b....b.b.......", ".......b.b....b.b.......", ".......b.b....b.b.......", ".......b.b....b.b.......", ".......b.b....b.b.......", "......bbbb....bbbb......", "........................", "........................"], "bpart": ["........................", "........................", "...........hh...........", ".........hhhhhh.........", ".........hhhhhh.........", ".........hhhhhh.........", ".........hhhhhh.........", "..........hhhh..........", "........................", "......tttttttttttt......", "...........tt...........", "..aa....tttttttt....aa..", "..aa.......tt.......aa..", "..aa...tttttttttt...aa..", "..aa.....t.tt.t.....aa..", "..aa....tttttttt....aa..", "..aa.......tt.......aa..", "..aa....tttttttt....aa..", "..aa.......tt.......aa..", "..aa.......tt.......aa..", "..aa....t..tt..t....aa..", "........tttttttt........", "...a................a...", "...a....l......l....a...", "...a....l......l....a...", "...a....l......l....a...", "...a....l......l....a...", "........l......l........", ".aaa....l......l....aaa.", "........l......l........", "........l......l........", ".......lll....lll.......", ".......l.l....l.l.......", ".......l.l....l.l.......", ".......l.l....l.l.......", ".......l.l....l.l.......", ".......l.l....l.l.......", "......llll....llll......", "........................", "........................"]};
const FW = 24, FH = 40;
// области приближения (координаты спрайта)
const VIEW = { full: [0, 0, 24, 40], head: [4, 0, 16, 14], torso: [3, 6, 18, 20], arms: [0, 6, 24, 26], legs: [4, 22, 16, 18] };
// точки на теле для выносок
const ANCHORS = {
  eyes: [[10, 5.2]], frontal: [[11.5, 3]], mouth: [[11.5, 8]],
  blood: [[9, 14.5]], skeleton: [[11.5, 16.5]], marrow: [[8, 21]], skin: [[7, 11.5]],
  arm: [[2.5, 19], [21, 19]], hand: [[2.5, 28.5], [21, 28.5]],
  leg: [[8.5, 30], [15, 30]], foot: [[7.5, 38.5], [16, 38.5]],
};

// ===================== состояние =====================
const $ = (id) => document.getElementById(id);
const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
let current = null;          // выбранная часть тела
let picked = {};             // имплант, открытый в карточке, по частям
let hoverAct = "";           // что сейчас под курсором (data-act)
let scanLv = 2;
try { scanLv = +(localStorage.getItem("cog-scan") ?? 2); } catch (e) {}
if (!(scanLv >= 0 && scanLv <= 3)) scanLv = 2;
let figView = "full", figXray = null;      // что сейчас нарисовано на схеме
let figFx = null;                          // анимация перерисовки схемы
let panelScroll = 0, panelReveal = 1e9, panelRows = 0;
let cardFx = null;
const consoleLog = [];
const implantsOf = (s) => s.implants;
const allSections = () => BODY.flatMap((p) => p.sections);
const countPart = (p) => p.sections.reduce((n, s) => n + implantsOf(s).length, 0);
const findImp = (part, id) => { if (!part || !id) return null; for (const s of part.sections) for (const i of implantsOf(s)) if (i.id === id) return [s, i]; return null; };
const partOf = (id) => BODY.find((p) => p.id === id) || null;

// редкость и тип импланта для карточки
const RARITY = [["advanced", "ПРОДВИНУТЫЙ"], ["rare", "РЕДКИЙ"], ["prestige", "ПРЕСТИЖНЫЙ"]];
const rarityName = (k) => (RARITY.find((r) => r[0] === k) || [k, String(k).toUpperCase()])[1];
const TYPES = { active: "АКТИВНЫЙ", passive: "ПАССИВНЫЙ", auto: "АВТОМАТИЧЕСКИЙ" };

// ===================== растр фигуры =====================
const PARTS = { h: "head", t: "torso", a: "arms", l: "legs" };
// границы каждой части тела в пикселях спрайта: [x0, y0, x1, y1] включительно
const PART_BOX = (() => {
  const box = {};
  const add = (k, x, y) => { const b = box[k] || (box[k] = [x, y, x, y]); b[0] = Math.min(b[0], x); b[1] = Math.min(b[1], y); b[2] = Math.max(b[2], x); b[3] = Math.max(b[3], y); };
  SPRITE.part.forEach((r, y) => [...r].forEach((c, x) => { if (c !== ".") { add(PARTS[c], x, y); add("full", x, y); } }));
  return box;
})();
// яркость пикселя схемы 0..4 и часть тела
function pix(x, y, xray, hot) {
  if (x < 0 || y < 0 || x >= FW || y >= FH) return [0, ""];
  const c = SPRITE.lv[y][x], b = SPRITE.bone[y][x];
  if (xray && b === "b") { const bp = PARTS[SPRITE.bpart[y][x]]; return [bp === xray ? 4 : 1, bp]; }

  const p = PARTS[SPRITE.part[y][x]], v = +c;
  if (xray) {
    if (b === "k") return [0, p];
    if (b === "g") return [3, p];
    if (v === 3) return [p === xray || p === hot ? 2 : 1, p];
    return [0, p];
  }
  if (p === hot && v === 1) return [2, p];
  return [v, p];
}
function pixAt(sx, sy, s, xray, hot) {
  if (s >= 1) return pix(Math.floor(sx), Math.floor(sy), xray, hot);

// ===================== узкий экран: вкладки и кнопки =====================
function drawTabs(g, T) {
  const n = T.n, w = Math.floor((L.cols - (n - 1)) / n);
  BODY.forEach((p, i) => {
    const x = (i % n) * (w + 1), y = T.y + Math.floor(i / n) * 3, act = "part:" + p.id;
    const on = current === p.id, hv = hoverAct === act;
    g.box(x, y, w, 3, "", "", on ? "h" : "m", act);
    const cnt = String(countPart(p));
    g.put(x + 1, y + 1, pad(" " + p.num.padEnd(4) + p.title.toUpperCase(), w - 3 - cnt.length) + cnt + " ", on ? "i" : hv ? "h" : "", act);
  });
}
function btnItems() {
  return [["ESC", "ОБЩИЙ ВИД"], ["F3", "ЗВУК " + (Snd.on ? "ВКЛ" : "ВЫКЛ")], ["F4", "РАЗВЁРТКА " + ["ВЫКЛ", "1", "2", "3"][scanLv]]];
}
function drawBtns(g, y0) {
  const n = 3;
  const w = Math.floor((L.cols - (n - 1)) / n);
  btnItems().forEach(([k, label], i) => {
    const x = (i % n) * (w + 1), y = y0 + Math.floor(i / n) * 3, act = "key:" + k, hv = hoverAct === act;
    const off = k === "ESC" && !current;
    g.box(x, y, w, 3, "", "", off ? "d" : "m", off ? "" : act);
    g.put(x + Math.max(1, Math.floor((w - label.length) / 2)), y + 1, label, off ? "d" : hv ? "h" : "", off ? "" : act);
  });
}

// ===================== строка клавиш (8) =====================
function keyItems() {
  return [
    ["ESC", "ОБЩИЙ ВИД"], ["F1", "ПОМОЩЬ"], ["F3", "ЗВУК " + (Snd.on ? "ВКЛ" : "ВЫКЛ")],
    ["F4", "РАЗВЁРТКА " + ["ВЫКЛ", "1", "2", "3"][scanLv]],
  ];
}
function drawKeys(g, y, w, wrapRows) {
  let x = 0, row = y;
  for (const [k, label] of keyItems()) {
    const act = "key:" + k, hv = hoverAct === act, len = k.length + 1 + label.length;
    if (x && x + 3 + len > w) { if (!wrapRows) break; row++; x = 0; }
    if (x) { g.put(x, row, " │ ", "d"); x += 3; }
    g.put(x, row, k, hv ? "h" : "m", act); g.put(x + k.length, row, " " + label, hv ? "h" : "", act);
    x += len;
  }
  return row - y + 1;
}

// ===================== отрисовка экрана =====================
function render() {
  if (!L) L = layout();
  const P = buildPanel(Math.max(10, L.panel.w - 4));
  let rows = L.rows;
  L.cmdPos = null;
  if (!L.wide) {
    L.panel.h = P.rows.length + 2;
    L.btnY = L.panel.y + L.panel.h + 1;
    rows = L.btnY + Math.ceil(btnItems().length / 3) * 3;
  }
  const g = new Grid(L.cols, rows);
  // линия под шапкой с осадной полосой легиона
  g.put(0, L.sepY, "─".repeat(L.cols), "d");
  g.put(0, L.sepY, "▄▀▄▀▄▀▄▀", "m");
  drawFig(g, L.fig);
  if (L.wide) {
    const R = L.left, iw = R.w - 4;
    g.box(R.x, R.y, R.w, R.h, "СЕГМЕНТЫ");
    // пункты меню через строку: крупнее мишень, спокойнее ритм
    menuRows(R.w - 2).filter(([t]) => t).forEach(([t, cl, ac], i) => g.put(R.x + 1, R.y + 2 + i * 2 + (i ? 1 : 0), t, cl, ac));
    const conTop = R.y + 14;
    g.sep(R.x, conTop, R.w, "КОНСОЛЬ");
    const logH = R.y + R.h - 2 - conTop - 2;
    consoleRows(iw, logH).forEach(([t, k], i, a) => g.put(R.x + 2, conTop + 1 + logH - a.length + i, t, k));
    drawConsoleInput(g, R.x + 2, R.y + R.h - 2, iw);
  } else drawTabs(g, L.tabs);
  const pv = drawPanel(g, L.panel, P);
  if (L.wide) { drawLeader(g, P, pv); drawKeys(g, L.keysY, L.cols, false); }
  else drawBtns(g, L.btnY);
  $("scr").innerHTML = g.html();
  lastGrid = g;
  // невидимое поле ввода стоит ровно на строке консоли
  const inp = $("cmd");
  if (L.cmdPos) { const [cx, cy, cw] = L.cmdPos; inp.hidden = false; inp.style.left = cx * CW + "px"; inp.style.top = cy * CH + "px"; inp.style.width = cw * CW + "px"; }
  else { inp.hidden = true; if (document.activeElement === inp) inp.blur(); }
}

// ===================== один такт для всех анимаций (10) =====================
// 1 такт = 16 мс. Луч рисует одну строку за такт, панель печатается по строке за такт.
const TICK = 16;
let tickT = 0;
function ensureTick() { if (!tickT) tickT = setInterval(tick, TICK); }
function tick() {
  let busy = false;

  if (panelReveal < panelRows) { panelReveal++; if (panelReveal % 3 === 0) Snd.tick(); busy = true; }
  if (cardFx && !cardFx.done) { busy = true; stepCard(); }
  render();
  if (!busy) { clearInterval(tickT); tickT = 0; }
}
function redrawFig(next, xray) {
  if (reduce) { figView = next; figXray = xray; figFx = null; render(); return; }
  Snd.disk(false);
  figFx = { phase: next === figView ? "collapse" : "target", t: 0, next, xray, blink: true, pass: 0, row: 0, pct: 0 };
  if (figFx.phase === "collapse") Snd.relay();

}
function stepFig() {
  const fx = figFx; fx.t++;

    fx.blink = Math.floor(fx.t / 4) % 2 === 0;
    if (fx.t >= 20) { fx.phase = "collapse"; fx.t = 0; Snd.relay(); }
  } else if (fx.phase === "collapse") {
    if (fx.t >= 6) { fx.phase = "raster"; fx.t = 0; fx.row = 0; fx.pass = 0; Snd.disk(true); }
  } else if (fx.phase === "raster") {
    const fh = L.fig.h - 3;

    if (fx.row >= fh) {
      if (fx.pass === 0) { fx.pass = 1; fx.row = 1; }
      else { figView = fx.next; figXray = fx.xray; figFx = null; Snd.disk(false); return; }
    }

}
function startCard(id) {

  cardFx = { id, phase: "req", t: 0, rows: 0, total: 1e9, done: false };
  ensureTick();
}
function stepCard() {
  const fx = cardFx; fx.t++;
  if (fx.phase === "req") { if (fx.t >= 12) { fx.phase = "data"; fx.t = 0; } return; }
  fx.rows++;
  if (fx.rows % 2 === 0) Snd.tick();
  if (fx.rows >= fx.total) fx.done = true;
}

// ===================== выбор части =====================
function select(id) {
  const part = partOf(id);
  const changed = (part ? part.id : null) !== current;
  current = part ? part.id : null;
  if (changed) {
    hoverAct = ""; cardFx = null; panelScroll = 0;
    panelReveal = reduce ? 1e9 : 0;
    clog(part ? `ДОСТУП: ${part.title.toUpperCase()} · ${part.lat}` : "ВОЗВРАТ: ОБЩИЙ ВИД", "");
    Snd.key();
    redrawFig(part ? part.id : "full", part ? part.id : null);
  }
  $("title").textContent = part ? part.title.toUpperCase() : "ОБЩИЙ ВИД";
  $("sub").textContent = part ? `СЕГМЕНТ ${part.num} · ${part.lat} · РЕНТГЕН` : `${imperialDate()} · ВЫБЕРИТЕ СЕГМЕНТ`;
  const want = current ? "#" + current : "";
  if (location.hash !== want) { try { history.replaceState(null, "", want || location.pathname + location.search); } catch (e) {} }
  render();
  ensureTick();
}
function pick(id) {
  if (!current) return;
  if (picked[current] !== id) startCard(id);
  picked[current] = id;
  scrollToCard = true;
  Snd.key();
  render();
  if (!L.wide && scrollToCard) {
    scrollToCard = false;
    const P = buildPanel(Math.max(10, L.panel.w - 4));
    const y = $("scr").getBoundingClientRect().top + scrollY + (L.panel.y + 1 + P.meta.cardRow - 3) * CH;
    scrollTo({ top: y, behavior: reduce ? "auto" : "smooth" });
  }
}
let scrollToCard = false;

// ===================== консоль и команды (14, 15) =====================
const CLOG_MAX = 40;
function clog(text, k = "m") { consoleLog.push([text, k]); while (consoleLog.length > CLOG_MAX) consoleLog.shift(); if (L) render(); }
const imperialDate = () => {
  const d = new Date(), start = new Date(d.getFullYear(), 0, 1);
  return "0 " + String(Math.floor(((d - start) / (365.25 * 864e5)) * 1000)).padStart(3, "0") + " 004.M31";
};
function setScan(n) { scanLv = n; document.documentElement.style.setProperty("--scan", [0, .16, .3, .45][scanLv]); try { localStorage.setItem("cog-scan", String(scanLv)); } catch (e) {} render(); }
function toggleSound() { Snd.set(!Snd.on); if (Snd.on) Snd.degauss(); render(); }
const HELP = ["ГОЛОВА ТОРС РУКИ НОГИ ОБЩИЙ", "ЗВУК РАЗВЁРТКА 0-3", "ДАТА ЛИТАНИЯ", "РЕЕСТР ВЫКЛЮЧИТЬ ОЧИСТИТЬ", "КЛАВИШИ: ESC F1 F3 F4"];
const CMD = {
  "ПОМОЩЬ": () => HELP,

  "ЗВУК": () => { toggleSound(); return "ЗВУК: " + (Snd.on ? "ВКЛ" : "ВЫКЛ"); },
  "РАЗВЁРТКА": (arg) => { const n = parseInt(arg, 10); setScan(n >= 0 && n <= 3 ? n : (scanLv + 1) % 4); return "РАЗВЁРТКА: " + ["ВЫКЛ", "1", "2", "3"][scanLv]; },
  "ДАТА": () => "ИМПЕРСКАЯ ДАТА: " + imperialDate(),
  "ЛИТАНИЯ": () => { const l = LEGION.litanies || [LEGION.motto]; return "++ " + l[Math.floor(Math.random() * l.length)].toUpperCase() + " ++"; },
  "РЕЕСТР": () => BODY.map((p) => `${p.num.padEnd(4)}${p.title.toUpperCase().padEnd(8)}${String(countPart(p)).padStart(3)} ИМПЛ.`),
  "ОЧИСТИТЬ": () => { consoleLog.length = 0; },
  "ВЫКЛЮЧИТЬ": () => { setTimeout(powerOff, 200); return "ГАШЕНИЕ ТРУБКИ..."; },
  "ОМНИССИЯ": () => "СЛАВА ОМНИССИИ. ДУХ МАШИНЫ ДОВОЛЕН.",
  "ЖЕЛЕЗО": () => "«" + LEGION.motto.toUpperCase() + "»",
  "ПЕРТУРАБО": () => "ПРИМАРХ НАБЛЮДАЕТ. РАБОТАЙТЕ.",
  "ХОРУС": () => "ЗАПРОС ОТКЛОНЁН. ОБРАЩЕНИЕ ЗАФИКСИРОВАНО.",
};
const ALIAS = { "?": "ПОМОЩЬ", "HELP": "ПОМОЩЬ", "ОБЗОР": "ОБЩИЙ", "НАЗАД": "ОБЩИЙ", "0": "ОБЩИЙ", "CLS": "ОЧИСТИТЬ", "CLEAR": "ОЧИСТИТЬ", "РАЗВЕРТКА": "РАЗВЁРТКА" };
const cmdHist = []; let histI = 0;
function runCmd(raw) {
  const line = raw.trim().toUpperCase(); if (!line) return;
  cmdHist.push(line); histI = cmdHist.length;
  clog("> " + line, "");
  const [w0, arg] = line.split(/\s+/), w = ALIAS[w0] || w0;
  const part = BODY.find((p) => p.title.toUpperCase() === w || p.id.toUpperCase() === w || p.num === w || String(BODY.indexOf(p) + 1) === w);
  if (part) { select(part.id); return; }
  const fn = CMD[w];
  if (!fn) { clog("НЕИЗВЕСТНАЯ КОМАНДА · F1 — ПОМОЩЬ"); return; }
  const out = fn(arg);
  if (out) [].concat(out).forEach((l) => clog(l, "h"));
  render();
}
const cmd = $("cmd");
cmd.addEventListener("input", () => render());
cmd.addEventListener("keydown", (e) => {
  if (e.key.length === 1 || e.key === "Backspace") Snd.key();
  if (e.key === "Enter") { e.preventDefault(); runCmd(cmd.value); cmd.value = ""; render(); }
  else if (e.key === "ArrowUp" && cmdHist.length) { e.preventDefault(); histI = Math.max(0, histI - 1); cmd.value = cmdHist[histI]; render(); }
  else if (e.key === "ArrowDown" && cmdHist.length) { e.preventDefault(); histI = Math.min(cmdHist.length, histI + 1); cmd.value = cmdHist[histI] || ""; render(); }
});
const KEYS = { ESC: () => select(null), F1: () => HELP.forEach((l) => clog(l, "h")), F3: toggleSound, F4: () => setScan((scanLv + 1) % 4) };
document.addEventListener("keydown", (e) => {
  const k = e.key === "Escape" ? "ESC" : /^F[134]$/.test(e.key) ? e.key : null;
  if (k) { e.preventDefault(); if (k !== "ESC" || current) { Snd.key(); KEYS[k](); } if (k === "ESC") cmd.blur(); return; }
  if (e.key === "PageDown" || e.key === "PageUp") { panelScroll += e.key === "PageDown" ? 8 : -8; render(); e.preventDefault(); return; }
  if (e.target === cmd || !L.wide || e.ctrlKey || e.metaKey || e.altKey || e.key.length !== 1 || e.key === " ") return;
  cmd.focus();
});

// ===================== мышь =====================
const scr = $("scr");
// действие под указателем берём по координатам из сетки знакомест:
// экран перерисовывается каждый такт, и элемент под пальцем успевает смениться между нажатием и отпусканием
let lastGrid = null;
function actAt(e) {
  if (!lastGrid) return "";
  const r = scr.getBoundingClientRect();
  const c = Math.floor((e.clientX - r.left) / CW), y = Math.floor((e.clientY - r.top) / CH);
  if (c < 0 || y < 0 || c >= lastGrid.w || y >= lastGrid.h) return "";
  return lastGrid.ac[y * lastGrid.w + c] || "";
}
scr.addEventListener("pointermove", (e) => {
  if (e.pointerType !== "mouse") return;   // на сенсорном экране наведения нет
  const act = actAt(e);
  if (act === hoverAct) return;
  hoverAct = act;
  if (act.startsWith("imp:")) { Snd.key(); startCard(act.slice(4)); }
  render();
});
scr.addEventListener("mouseleave", () => { if (hoverAct) { hoverAct = ""; render(); } });
scr.addEventListener("mousedown", (e) => { if (e.detail > 1) e.preventDefault(); });   // двойной клик не выделяет слово
// своё «нажатие»: браузерный click теряется, если элемент под курсором перерисовался между нажатием и отпусканием
let downAt = null;
scr.addEventListener("pointerdown", (e) => { if (e.button === 0) downAt = [e.clientX, e.clientY, actAt(e)]; });
scr.addEventListener("pointercancel", () => { downAt = null; });
scr.addEventListener("pointerup", (e) => {
  if (!downAt) return;
  const [x0, y0, act0] = downAt; downAt = null;
  if (Math.hypot(e.clientX - x0, e.clientY - y0) > 12) return;   // это была прокрутка пальцем
  const act = actAt(e) || act0;
  if (act !== act0) return;
  press(act);
});
function press(act) {
  if (act.startsWith("part:")) { const id = act.slice(5) || null; select(!L.wide && id === current ? null : id); }
  else if (act.startsWith("imp:")) pick(act.slice(4));
  else if (act.startsWith("key:")) { Snd.key(); KEYS[act.slice(4)](); }
  else if (act.startsWith("scroll:")) { panelScroll += +act.slice(7) * 8; render(); }
  else if (act === "cmd") cmd.focus();
}
scr.addEventListener("wheel", (e) => {
  if (!L || !L.wide) return;
  const col = Math.floor((e.clientX - scr.getBoundingClientRect().left) / CW);
  if (col < L.panel.x) return;
  e.preventDefault();
  panelScroll += Math.sign(e.deltaY) * 3;
  render();
}, { passive: false });

// ===================== звук (по желанию) =====================
// Всё собрано из шума и коротких затухающих резонансов: щелчки реле,
// клавиши, треск дисковода, сетевой гул и писк строчной развёртки кинескопа.
const Snd = (() => {
  let ctx = null, on = false, bed = null, diskT = 0, noiseBuf = null;
  try { on = localStorage.getItem("cog-sound") === "1"; } catch (e) {}
  const ensure = () => {
    if (!on) return null;
    if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; } }
    if (ctx.state === "suspended") ctx.resume();
    if (!noiseBuf) { noiseBuf = ctx.createBuffer(1, ctx.sampleRate * 2, ctx.sampleRate); const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1; }
    if (!bed) startBed();
    return ctx;
  };
  // короткий удар шума через фильтр: основа всех механических звуков
  function burst(t, { type = "bandpass", f = 2000, q = 1, gain = .2, len = .02, attack = .001 } = {}) {
    const n = ctx.createBufferSource(); n.buffer = noiseBuf;
    const fl = ctx.createBiquadFilter(); fl.type = type; fl.frequency.value = f; fl.Q.value = q;
    const g = ctx.createGain(); g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(gain, t + attack); g.gain.exponentialRampToValueAtTime(.0001, t + len);
    n.connect(fl); fl.connect(g); g.connect(ctx.destination);
    n.start(t, Math.random() * 1.5); n.stop(t + len + .02);
  }
  // фон: сетевой гул трансформатора с гармониками и едва слышный писк строчника
  function startBed() {
    const master = ctx.createGain(); master.gain.value = 0; master.connect(ctx.destination);
    master.gain.linearRampToValueAtTime(1, ctx.currentTime + 1.2);
    const mains = ctx.createOscillator(); mains.type = "square"; mains.frequency.value = 50;
    const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 260; lp.Q.value = .7;
    const gm = ctx.createGain(); gm.gain.value = .006; mains.connect(lp); lp.connect(gm); gm.connect(master);
    const whine = ctx.createOscillator(); whine.frequency.value = 15625;
    const gw = ctx.createGain(); gw.gain.value = .0025; whine.connect(gw); gw.connect(master);
    const hiss = ctx.createBufferSource(); hiss.buffer = noiseBuf; hiss.loop = true;
    const hf = ctx.createBiquadFilter(); hf.type = "highpass"; hf.frequency.value = 5000;
    const gh = ctx.createGain(); gh.gain.value = .0018; hiss.connect(hf); hf.connect(gh); gh.connect(master);
    mains.start(); whine.start(); hiss.start();
    bed = { master, nodes: [mains, whine, hiss] };
  }
  function stopBed() { if (!bed) return; const b = bed; bed = null; b.master.gain.linearRampToValueAtTime(0, ctx.currentTime + .15); setTimeout(() => b.nodes.forEach((n) => n.stop()), 250); }
  return {
    get on() { return on; },
    set(v) { on = v; try { localStorage.setItem("cog-sound", v ? "1" : "0"); } catch (e) {} if (v) ensure(); else { this.disk(false); if (ctx) stopBed(); } },
    wake() { if (on) ensure(); },
    // печать на экран: еле слышный треск
    tick() { if (!ensure()) return; burst(ctx.currentTime, { f: 5200 + Math.random() * 1500, q: 3, gain: .025, len: .008 }); },
    // клавиша: стук колпачка и щелчок пружины
    key() {
      if (!ensure()) return; const t = ctx.currentTime;
      burst(t, { type: "lowpass", f: 420, q: 1.5, gain: .16, len: .035 });
      burst(t + .002, { f: 3200 + Math.random() * 600, q: 2.5, gain: .07, len: .012 });
      burst(t + .045 + Math.random() * .02, { type: "lowpass", f: 700, q: 1, gain: .05, len: .02 });
    },
    // реле переключения режима: два металлических щелчка с дребезгом
    relay() {
      if (!ensure()) return; const t = ctx.currentTime;
      burst(t, { f: 2600, q: 9, gain: .22, len: .03 });
      burst(t + .006, { type: "lowpass", f: 300, q: 2, gain: .12, len: .04 });
      burst(t + .028, { f: 3100, q: 9, gain: .1, len: .02 });
    },
    // дисковод: хаотичный треск головки, пока идёт прорисовка
    disk(start) {

        if (!on) return; const t = ctx.currentTime;
        burst(t, { f: 900 + Math.random() * 700, q: 6, gain: .05 + Math.random() * .04, len: .012 });
        if (Math.random() < .3) burst(t + .01, { type: "lowpass", f: 180, q: 3, gain: .06, len: .05 });

    },
    // треск помехи при сбое развёртки
    crackle() {
      if (!ensure()) return; const t = ctx.currentTime, n = 4 + Math.floor(Math.random() * 4);
      for (let i = 0; i < n; i++) burst(t + Math.random() * .12, { type: "highpass", f: 2500 + Math.random() * 3000, q: .7, gain: .04 + Math.random() * .07, len: .004 + Math.random() * .015 });
    },
    // щелчок выключателя и глухой удар при гашении трубки

    },
    // размагничивание кинескопа при включении звука: глухой «бум» с затухающим гулом
    degauss() {
      if (!ensure()) return; const t = ctx.currentTime;
      burst(t, { type: "lowpass", f: 140, q: 4, gain: .35, len: .25 });
      const o = ctx.createOscillator(); o.type = "square"; o.frequency.value = 50;
      const lp = ctx.createBiquadFilter(); lp.type = "lowpass"; lp.frequency.value = 220;
      const g = ctx.createGain(); g.gain.setValueAtTime(.09, t); g.gain.exponentialRampToValueAtTime(.0001, t + 1.1);
      o.connect(lp); lp.connect(g); g.connect(ctx.destination); o.start(t); o.stop(t + 1.2);
    },
  };
})();


// ===================== литании (11: ритм кратен такту) =====================
function startLitanies() {
  const list = (LEGION.litanies && LEGION.litanies.length ? LEGION.litanies : [LEGION.motto]).map((l) => "++ " + l.toUpperCase() + " ++");
  let i = 0, typing = 0;
  const show = (txt) => {
    clearInterval(typing);
    const el = $("lit");
    if (reduce) { el.textContent = txt; return; }
    let n = 0; el.textContent = "";
    typing = setInterval(() => { el.textContent = txt.slice(0, ++n); if (n >= txt.length) clearInterval(typing); }, TICK * 2);
  };
  show(list[0]);
  setInterval(() => { i = (i + 1) % list.length; show(list[i]); }, 7000);
}

// ===================== 6, 7, 8, 9: живая нестабильность =====================
let screenOn = true;
function flicker() {
  if (screenOn && !reduce) $("flick").animate([{ opacity: 0 }, { opacity: .07 }, { opacity: .02 }, { opacity: .05 }, { opacity: 0 }], { duration: 180 + Math.random() * 120 });
  setTimeout(flicker, 2500 + Math.random() * 5500);
}
function glitch() {
  if (screenOn && !reduce) {
    const band = $("gband"), y = Math.random() * innerHeight;
    band.style.top = y + "px"; band.style.height = 2 + Math.floor(Math.random() * 6) + "px"; band.hidden = false;
    $("term").animate([{ transform: "translateX(0)" }, { transform: "translateX(5px) skewX(-1deg)" }, { transform: "translateX(-3px)" }, { transform: "translateX(2px)" }, { transform: "translateX(0)" }], { duration: 160, easing: "steps(4)" });
    Snd.crackle();
    setTimeout(() => { band.hidden = true; }, 110);
  }
  setTimeout(glitch, 40000 + Math.random() * 40000);
}

function hideLead() { hoverAct = ""; }
// ===================== 10, 11: включение и гашение трубки =====================
async function powerOn(target) {
  const pw = $("power");
  screenOn = true;
  pw.querySelector("i").style.display = "none";
  if (reduce) { pw.hidden = true; return; }
  pw.hidden = false;
  Snd.degauss();
  // чёрная заслонка плавно уходит, а изображение набирает яркость, как прогревающаяся трубка
  const veil = pw.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 700, easing: "ease-out", fill: "forwards" });
  const warm = target.animate([{ filter: "brightness(.35) blur(1px)" }, { filter: "brightness(.8) blur(.4px)", offset: .5 }, { filter: "brightness(1) blur(0)" }], { duration: 1100, easing: "ease-out" });
  await veil.finished.catch(() => {});
  pw.hidden = true; veil.cancel();
  await warm.finished.catch(() => {});
}
async function powerOff() {
  if (!screenOn || reduce) return;
  screenOn = false; hideLead(); Snd.off(); Snd.disk(false);
  const term = $("term"), pw = $("power"), dot = pw.querySelector("i");
  const a = term.animate([{ transform: "scaleY(1)", filter: "brightness(1)" }, { transform: "scaleY(.006)", filter: "brightness(1.4)" }], { duration: 160, easing: "ease-in", fill: "forwards" });
  await a.finished.catch(() => {});
  pw.hidden = false; dot.style.display = "";
  await dot.animate([{ width: "60vw", height: "2px", opacity: .8 }, { width: "4px", height: "4px", opacity: .6, offset: .55 }, { width: "2px", height: "2px", opacity: 0 }], { duration: 600, easing: "ease-in", fill: "forwards" }).finished.catch(() => {});
  a.cancel(); dot.getAnimations().forEach((x) => x.cancel()); dot.style.display = "none";
}
let hadFocus = false;
const wake = () => { if (!screenOn) powerOn($("term")); };
document.addEventListener("pointerdown", () => { hadFocus = true; wake(); }, true);
document.addEventListener("keydown", () => { hadFocus = true; wake(); }, true);


// ===================== 13: курсор-прицел со следом =====================
if (matchMedia("(pointer: fine)").matches && !reduce) {
  document.documentElement.classList.add("cc");
  const cur = $("cur"), N = 6, trail = [], hist = [];
  for (let i = 0; i < N; i++) { const t = document.createElement("div"); t.className = "trl"; t.style.opacity = 0; document.body.appendChild(t); trail.push(t); }
  let mx = -99, my = -99, inside = false;
  document.addEventListener("pointermove", (e) => {
    mx = e.clientX; my = e.clientY; inside = true; cur.hidden = false;
    const el = e.target;
    cur.classList.toggle("on", !!(el.closest && el.closest("button, [data-act]:not([data-act^='sec:']), .part, .mn")));
    cur.classList.toggle("txt", !!(el.closest && el.closest("input")));
  });
  document.addEventListener("pointerleave", () => { inside = false; cur.hidden = true; trail.forEach((t) => (t.style.opacity = 0)); });
  document.documentElement.addEventListener("mouseleave", () => { inside = false; cur.hidden = true; trail.forEach((t) => (t.style.opacity = 0)); });
  let lastMove = 0;
  document.addEventListener("pointermove", () => { lastMove = performance.now(); });
  const loop = (t) => {
    if (inside && screenOn && t - lastMove < 400) {
      cur.style.transform = `translate(${mx}px, ${my}px)`;
      hist.unshift([mx, my]); hist.length = Math.min(hist.length, N * 2);
      trail.forEach((t, i) => { const h = hist[(i + 1) * 2] || hist[hist.length - 1]; t.style.transform = `translate(${h[0]}px, ${h[1]}px)`; t.style.opacity = (0.45 * (1 - i / N)).toFixed(2); });
    } else if (!screenOn) { cur.hidden = true; }
    requestAnimationFrame(loop);
  };
  requestAnimationFrame(loop);
}


function boot(done) {
  let seen = false;
  try { seen = sessionStorage.getItem("cog-booted") === "1"; sessionStorage.setItem("cog-booted", "1"); } catch (e) {}
  if (seen || reduce) { powerOn($("term")); return done(); }
  const el = $("boot"), n = allSections().length;
  const lines = [
    ["m", "КОГИТАТОР МОД. IV-Ω · КУЗНЯ ОЛИМПИИ"], ["", ""],
    ["h", "++ ПРОБУЖДЕНИЕ ДУХА МАШИНЫ ++"], ["", ""],
    ["", "ПРОВЕРКА ЛИТАНИЙ ................ [ OK ]"],
    ["", "ЗАГРУЗКА СХЕМЫ ЛЕГИОНЕРА ........ [ OK ]"],
    ["", `РЕЕСТР АУГМЕТИКИ: ${String(n).padStart(2)} СЕКЦИЙ ..... [ OK ]`],
    ["", "СВЯЗЬ С IV ЛЕГИОНОМ ............. [ OK ]"], ["", ""],
    ["h", "ДОСТУП РАЗРЕШЁН"],
  ];
  el.hidden = false;
  powerOn(el);
  let i = 0, timer = 0, finished = false;
  const render = () => { el.innerHTML = lines.slice(0, i).map(([k, t]) => k ? `<span class="${k}">${t}</span>` : t).join("\n") + '<span class="cur">█</span>'; };
  const finish = () => {
    if (finished) return; finished = true;
    clearInterval(timer); i = lines.length; render();
    el.classList.add("out"); setTimeout(() => { el.hidden = true; }, 380);
    done();
  };
  render();
  timer = setInterval(() => { i++; Snd.tick(); render(); if (i >= lines.length) { clearInterval(timer); setTimeout(finish, 450); } }, 130);
  el.addEventListener("click", finish);
  document.addEventListener("keydown", finish, { once: true });
}


// ===================== запуск =====================
let rz = 0;
window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(() => { pickCell(); L = layout(); render(); }, 80); });
window.addEventListener("hashchange", () => { const id = location.hash.slice(1); if ((id || null) !== current) select(partOf(id) ? id : null); });

$("cap").textContent = `${LEGION.numeral} ЛЕГИОН\n${LEGION.name.toUpperCase()}\n«${LEGION.motto.toUpperCase()}»`;
$("emblem").innerHTML = EMB.map((row, y) => [...row].map((c, x) => (c === "X" ? `<rect x="${x}" y="${y}" width="1" height="1" fill="var(--fg)"/>` : "")).join("")).join("");
document.documentElement.style.setProperty("--scan", [0, .16, .3, .45][scanLv]);
pickCell();
L = layout();
clog("КОГИТАТОР ГОТОВ");
clog("ДАТА " + imperialDate());
clog("F1 — СПИСОК КОМАНД");
const start = location.hash.slice(1);
const startPart = partOf(start) ? start : null;
current = startPart; figView = startPart || "full"; figXray = startPart;
select(startPart);
if (document.fonts) document.fonts.ready.then(() => render());
boot(() => { startLitanies(); setTimeout(flicker, 3000); setTimeout(glitch, 30000 + Math.random() * 30000); });
</script>
