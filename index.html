<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Когитатор аугметики</title>
<style>html,body{margin:0;height:100%;background:#020a04}</style>
</head>
<body>
<script>
fetch("app.html?t=" + Date.now(), { cache: "no-store" })
  .then(function (r) { if (!r.ok) throw new Error(r.status); return r.text(); })
  .then(function (html) { document.open(); document.write(html); document.close(); })
  .catch(function () { location.replace("app.html"); });
</script>
</body>
</html>
